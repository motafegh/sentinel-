class: CallToUnknown
description: >
  Raw/dynamic low-level external-call-family interaction with an unknown or
  unverified callee. Includes call, delegatecall, legacy callcode, staticcall,
  and send patterns. A checked raw low-level call can still qualify because the
  unknown/dynamic target is class-defining.

scope_authority: R4-D-016

explicit_exclusions:
  - transfer
  - ordinary_typed_high_level_interface_call
  - same_file_or_in_scope_library_call
  - contract_creation
  - selfdestruct_or_suicide_destination

v9_signal:
  method: graph_edge
  edge_type: EXTERNAL_CALL
  edge_id: 11
  note: >
    Historical v9 EXTERNAL_CALL is not sufficient class truth because it
    conflates library/high-level interactions and misses material low-level/send
    cases. R4-D-010 withdrew it as an adequate future-training semantic signal.

v10_signal:
  method: graph_edge
  edge_types:
    - LOW_LEVEL_CALL
    - ETHER_SEND
  note: >
    Coarse positive corroboration only. ETHER_TRANSFER, HIGH_LEVEL_CALL,
    LIBRARY_CALL, and CONTRACT_CREATION are intentionally excluded from the
    CallToUnknown graph signal. Source review remains truth authority.

false_positive_risk:
  level: VERY_HIGH
  bccc_fp_rate: "86.9%"
  bccc_root_cause: >
    86.9% of BCCC CallToUnknown positives had NO low-level call at all.
    The BCCC labels were folder-assigned without code verification.
    Transfer-only and library/high-level behavior must not be promoted into
    CallToUnknown merely because an external address is involved.

library_call_exclusion: >
  SafeERC20.safeTransfer(), OZ AccessControl, same-file declared libraries, and
  other ordinary typed/library calls are not CallToUnknown solely because they
  cross an interface/address boundary.

positive_example: |
  function execute(address target, bytes calldata data) public {
      (bool ok,) = target.call(data);
      require(ok, "call failed");
  }

negative_example: |
  function withdraw(address payable recipient, uint256 amount) internal {
      recipient.transfer(amount);
  }

dasp_id: 7
tier_for_solidifi: T0
