name: One-shot R4 Phase 8 governance reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-r4-phase8-governance-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register Phase 8 evidence and execution log
        run: python3 .github/scripts/one_shot_r4_phase8_governance_reconcile.py

      - name: Remove one-shot files and publish reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm '.github/workflows/one-shot-r4-phase8-governance-reconcile.yml'
          rm '.github/scripts/one_shot_r4_phase8_governance_reconcile.py'
          git config user.name 'sentinel-r4-automation'
          git config user.email 'sentinel-r4-automation@users.noreply.github.com'
          git add docs/plan/ml-R4/ARTIFACT_INDEX.md docs/plan/ml-R4/EXECUTION_LOG.md '.github/workflows/one-shot-r4-phase8-governance-reconcile.yml' '.github/scripts/one_shot_r4_phase8_governance_reconcile.py'
          git commit -m 'docs(r4): register Phase 8 audit reconciliation'
          git push origin HEAD:main
