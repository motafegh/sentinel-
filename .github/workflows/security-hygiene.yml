name: Security hygiene

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan current tracked repository state
        run: python3 tools/security/scan_repository_secrets.py --scope current

  history-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan unique reachable Git blobs
        run: python3 tools/security/scan_repository_secrets.py --scope history
