name: R4 Phase 4 G4 gate

on:
  push:
    branches:
      - r4/phase4-targeted-gap-adjudication
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g4-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen sample, bundle, review, roles, and G4 registration
        run: |
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('docs/plan/ml-R4')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          sample_path = root / 'manifests/p4_gap002_initial_sample.jsonl'
          bundle_path = root / 'review_bundles/r4_gap002_blind_review_bundle_v1.zip'
          review_path = root / 'reviews/R4-GAP-002/p4_gap002_blind_semantic_review_v1.jsonl'
          report_path = root / 'findings/06_gap002_blind_semantic_review_report.json'
          population_path = root / 'manifests/p4_gap002_population_manifest.json'

          expected_sample = '2899ad5a210ac6e2e2a4e6b43f31cd718afa3b1d603b659cdd6bf0918f34fbe9'
          expected_bundle = '2b1ce12fdd96819c89bbb9fe1dfb2d9aa992ec0a05ce32f651c6b834b97ddf38'
          expected_review = '7d7f0cce287c847df2376ac0f580abf6be05b46f6a2c90b5f00f9b34f8fc5473'
          expected_ledger = '3983cc2b3317515d546c784449b583ac9a7c23ac8da267ee10f5640857cd0ac7'

          assert sha256(sample_path) == expected_sample
          assert sha256(bundle_path) == expected_bundle
          assert sha256(review_path) == expected_review

          population = json.loads(population_path.read_text())
          assert population['gap_id'] == 'R4-GAP-002'
          assert population['sample_sha256'] == expected_sample
          assert population['ledger_sha256'] == expected_ledger
          assert population['initial_total'] == 100
          assert population['initial_per_stratum'] == 20
          assert population['selection_policy']['eligible_split_policy'] == 'TRAIN_ONLY_AND_GROUP_MUST_NOT_TOUCH_VAL_OR_TEST'
          assert population['selection_policy']['cross_stratum_group_reuse'] == 'FORBIDDEN'

          sample = [json.loads(x) for x in sample_path.read_text().splitlines() if x.strip()]
          review = [json.loads(x) for x in review_path.read_text().splitlines() if x.strip()]
          report = json.loads(report_path.read_text())
          assert len(sample) == 100 == len(review)
          assert len({x['contract_id'] for x in sample}) == 100
          assert len({x['review_group_id'] for x in sample}) == 100
          assert all(x['historical_split'] == 'train' for x in sample)
          assert len({x['contract_id'] for x in review}) == 100
          assert len({x['review_group_id'] for x in review}) == 100
          assert report['review_rows_sha256'] == expected_review
          assert report['sample_sha256'] == expected_sample
          assert report['reviewer_kind'] == 'AI_PRIMARY_SEMANTIC_REVIEW'
          assert report['review_mode'] == 'SOURCE_ONLY_BLIND'

          sample_ids = {(x['class_name'], x['stratum_ordinal']): (x['contract_id'], x['review_group_id']) for x in sample}
          assert len(sample_ids) == 100
          for row in review:
              assert sample_ids[(row['class_name'], row['stratum_ordinal'])] == (row['contract_id'], row['review_group_id'])
              assert row['model_tool_evidence_revealed'] is False
              assert row['creates_confirmed_negative'] is False

          counts = {c: Counter(r['review_state'] for r in review if r['class_name'] == c) for c in report['strata']}
          assert counts['DenialOfService'] == Counter({'DOES_NOT_SUPPORT_POSITIVE': 20})
          assert counts['IntegerUO'] == Counter({'DOES_NOT_SUPPORT_POSITIVE': 16, 'SUPPORTS_POSITIVE': 3, 'UNCLEAR_INSUFFICIENT': 1})
          assert counts['Timestamp'] == Counter({'DOES_NOT_SUPPORT_POSITIVE': 15, 'SUPPORTS_POSITIVE': 4, 'UNCLEAR_INSUFFICIENT': 1})
          assert counts['TransactionOrderDependence'] == Counter({'SUPPORTS_POSITIVE': 12, 'DOES_NOT_SUPPORT_POSITIVE': 5, 'CLASS_BOUNDARY_CONFLICT': 3})
          assert counts['UnusedReturn'] == Counter({'DOES_NOT_SUPPORT_POSITIVE': 11, 'SUPPORTS_POSITIVE': 9})

          assert report['strata']['TransactionOrderDependence']['role_recommendation'] == 'TRAIN_WEAK'
          for cls in ('DenialOfService', 'IntegerUO', 'Timestamp', 'UnusedReturn'):
              assert report['strata'][cls]['role_recommendation'] == 'MASK_OR_EXCLUDE'

          gap = (root / 'EVIDENCE_GAP_REGISTER.md').read_text()
          assert '| R4-GAP-002 ' in gap and '| RESOLVED |' in gap
          assert expected_sample in gap and expected_bundle in gap and expected_review in gap

          status = (root / 'PLAN_STATUS_MATRIX.md').read_text()
          assert '| 4 | `phases/05_PHASE_4_TARGETED_GAP_ADJUDICATION.md` | PASSED |' in status
          assert '| 5 | `phases/06_PHASE_5_DATA_VNEXT_POLICY_AND_DESIGN.md` | READY |' in status

          phase4 = (root / 'phases/05_PHASE_4_TARGETED_GAP_ADJUDICATION.md').read_text()
          phase5 = (root / 'phases/06_PHASE_5_DATA_VNEXT_POLICY_AND_DESIGN.md').read_text()
          assert '**Status:** PASSED — G4 PASS' in phase4
          assert '**G4 PASS.**' in phase4
          assert '**Status:** READY — G4 SATISFIED' in phase5

          artifacts = (root / 'ARTIFACT_INDEX.md').read_text()
          assert '## Phase 4 artifacts — targeted gap adjudication (G4 PASS)' in artifacts
          assert expected_sample in artifacts and expected_bundle in artifacts and expected_review in artifacts

          log = (root / 'EXECUTION_LOG.md').read_text()
          assert 'R4-LOG-20260811-007 — Phase 4 Targeted DIVE Gap Adjudication and G4 Closure' in log
          assert '**Gate effect:** **G4 PASS.**' in log

          print(json.dumps({
              'passed': True,
              'sample_sha256': expected_sample,
              'bundle_sha256': expected_bundle,
              'review_sha256': expected_review,
              'tasks': 100,
              'phase4': 'PASSED',
              'phase5': 'READY',
          }, indent=2))
          PY
