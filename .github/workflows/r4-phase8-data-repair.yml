name: R4 Phase 8 real-data repository repair

on:
  push:
    branches: [main]
    paths:
      - 'data_module/CLAUDE.md'
      - 'data_module/sentinel_data/preprocessing/**'
      - 'data_module/sentinel_data/representation/**'
      - 'data_module/sentinel_data/vnext/**'
      - 'data_module/tests/test_preprocessing/**'
      - 'data_module/tests/test_representation/**'
      - 'data_module/tests/test_vnext/**'
      - 'ml/src/data_extraction/**'
      - 'ml/src/datasets/vnext_repaired_dataset.py'
      - 'ml/src/datasets/vnext_logical_v3_dataset.py'
      - 'ml/src/training/vnext_repaired_binding.py'
      - 'docs/plan/ml-R4/**'
      - '.github/workflows/r4-phase8-data-repair.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data_module/sentinel_data/preprocessing/**'
      - 'data_module/sentinel_data/representation/**'
      - 'data_module/sentinel_data/vnext/**'
      - 'data_module/tests/**'
      - 'ml/src/data_extraction/**'
      - 'ml/src/datasets/vnext_repaired_dataset.py'
      - 'ml/src/datasets/vnext_logical_v3_dataset.py'
      - 'ml/src/training/vnext_repaired_binding.py'
      - 'docs/plan/ml-R4/**'
      - '.github/workflows/r4-phase8-data-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository-safe test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest 'numpy==1.26.4' 'pyarrow==19.0.1' \
            'torch==2.10.0' 'torch-geometric==2.7.0' \
            'transformers==4.46.3'

      - name: Compile repaired DATA, ML, token, and research modules
        run: |
          python -m py_compile \
            data_module/sentinel_data/preprocessing/normalizer.py \
            data_module/sentinel_data/preprocessing/deduplicator.py \
            data_module/sentinel_data/preprocessing/compiler.py \
            data_module/sentinel_data/preprocessing/r4_versions.py \
            data_module/sentinel_data/preprocessing/r4_pipeline.py \
            data_module/sentinel_data/preprocessing/r4_raw_verifier.py \
            data_module/sentinel_data/preprocessing/r4_completeness.py \
            data_module/sentinel_data/preprocessing/r4_grouping.py \
            data_module/sentinel_data/preprocessing/r4_grouping_v3.py \
            data_module/sentinel_data/preprocessing/r4_grouping_audit.py \
            data_module/sentinel_data/representation/target_selector.py \
            data_module/sentinel_data/representation/r4_target_spans.py \
            data_module/sentinel_data/representation/r4_compatibility.py \
            data_module/sentinel_data/representation/r4_orchestrator.py \
            data_module/sentinel_data/representation/r4_sensitivity.py \
            data_module/sentinel_data/vnext/r4_source_claims.py \
            data_module/sentinel_data/vnext/r4_builder.py \
            data_module/sentinel_data/vnext/r4_binding.py \
            data_module/sentinel_data/vnext/r4_v3_versions.py \
            data_module/sentinel_data/vnext/r4_logical_v3.py \
            data_module/sentinel_data/vnext/confirmed_negative_evaluation.py \
            ml/src/data_extraction/windowed_tokenizer.py \
            ml/src/data_extraction/bounded_window_selector.py \
            ml/src/datasets/vnext_repaired_dataset.py \
            ml/src/datasets/vnext_logical_v3_dataset.py \
            ml/src/training/vnext_repaired_binding.py \
            docs/plan/ml-R4/scripts/p8_verify_repaired_raw_inputs.py \
            docs/plan/ml-R4/scripts/p8_rebuild_repaired_data.py \
            docs/plan/ml-R4/scripts/p8_rebuild_logical_v3.py \
            docs/plan/ml-R4/scripts/p8_build_repaired_evidence_ledger.py \
            docs/plan/ml-R4/scripts/p8_audit_repaired_lineage.py \
            docs/plan/ml-R4/scripts/p8_compare_bounded_window_strategies.py \
            docs/plan/ml-R4/scripts/p8_run_repaired_micro_smoke.py \
            docs/plan/ml-R4/scripts/p8_build_confirmed_negative_review_queue.py \
            docs/plan/ml-R4/scripts/p8_validate_confirmed_negative_adjudications.py \
            docs/plan/ml-R4/scripts/p8_audit_grouping_breadth.py \
            docs/plan/ml-R4/scripts/p8_profile_representation_sensitivity.py \
            docs/plan/ml-R4/scripts/p8_compare_bounded_window_selector_v1.py \
            docs/plan/ml-R4/scripts/p8_run_selector_gpu_compare.py

      - name: Run repaired and Phase-8 research regression suite
        env:
          PYTHONPATH: .:data_module
        run: |
          python -m pytest -q -c /dev/null \
            data_module/tests/test_preprocessing/test_pipeline.py \
            data_module/tests/test_preprocessing/test_r4_repair.py \
            data_module/tests/test_preprocessing/test_r4_data_gates.py \
            data_module/tests/test_preprocessing/test_r4_grouping.py \
            data_module/tests/test_preprocessing/test_r4_grouping_v3.py \
            data_module/tests/test_preprocessing/test_r4_grouping_audit.py \
            data_module/tests/test_representation/test_r4_target_selector.py \
            data_module/tests/test_representation/test_r4_compatibility.py \
            data_module/tests/test_representation/test_bounded_window_strategy.py \
            data_module/tests/test_representation/test_bounded_window_selector.py \
            data_module/tests/test_representation/test_r4_sensitivity.py \
            data_module/tests/test_representation/test_windowed_tokenizer_coverage.py \
            data_module/tests/test_vnext/test_policy.py \
            data_module/tests/test_vnext/test_r4_source_claims.py \
            data_module/tests/test_vnext/test_r4_builder.py \
            data_module/tests/test_vnext/test_r4_binding.py \
            data_module/tests/test_vnext/test_repaired_ml_adapter.py \
            data_module/tests/test_vnext/test_r4_logical_v3.py \
            data_module/tests/test_vnext/test_logical_v3_ml_adapter.py \
            data_module/tests/test_vnext/test_confirmed_negative_evaluation.py

      - name: Prove frozen historical G6 artifacts still validate
        env:
          PYTHONPATH: .:data_module
        run: |
          python docs/plan/ml-R4/scripts/p6_validate_frozen_partitions.py

      - name: Whitespace/error diff check across repair tranche
        run: |
          git diff --check a10fae041cc5f436b5607b6fd54fcabf63386059..HEAD
