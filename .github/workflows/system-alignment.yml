name: SENTINEL system alignment

on:
  push:
    branches:
      - system/zkml-contracts-alignment
  pull_request:
    paths:
      - "contracts/**"
      - "zkml/**"
      - "agents/src/security/**"
      - "agents/src/mcp/servers/audit/**"
      - "agents/tests/test_policy_signer_v3.py"
      - ".github/workflows/system-alignment.yml"

permissions:
  contents: read

jobs:
  zkml-boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boundary-test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run dependency-light ZKML boundary tests
        run: |
          # Isolate from root pyproject pytest addopts (coverage/plugins belong to
          # the full project environment, not these standard-library boundary tests).
          python -m pytest -q -c /dev/null \
            zkml/tests/test_run_proof.py \
            zkml/tests/test_validate_bundle.py

      - name: Validate tracked V2 artifact bundle structure
        run: |
          python zkml/src/ezkl/validate_bundle.py \
            --output /tmp/zkml-v2-bundle-report.json
          cat /tmp/zkml-v2-bundle-report.json

  v3-policy-protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install policy-protocol dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest web3==7.15.0

      - name: Run V3 policy-signer tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -c /dev/null agents/tests/test_policy_signer_v3.py

  contracts-foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Bootstrap locked Solidity dependencies
        run: bash contracts/scripts/bootstrap_deps.sh

      - name: Show toolchain identity
        run: |
          forge --version
          git -C contracts/lib/forge-std rev-parse HEAD
          git -C contracts/lib/openzeppelin-contracts rev-parse HEAD
          git -C contracts/lib/openzeppelin-contracts-upgradeable rev-parse HEAD

      - name: Isolate generated EZKL verifier from registry unit compilation
        run: |
          test -f contracts/src/ZKMLVerifier.sol
          mv contracts/src/ZKMLVerifier.sol /tmp/SENTINEL_ZKMLVerifier.sol

      - name: Compute Python golden V3 digest
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --disable-pip-version-check web3==7.15.0 pytest
          DIGEST="$(python - <<'PY'
          from agents.tests.test_policy_signer_v3 import _request
          print(_request().digest)
          PY
          )"
          echo "SENTINEL_GOLDEN_V3_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Python V3 digest: $DIGEST"

      - name: Report formatting drift without blocking behavioral validation
        working-directory: contracts
        run: forge fmt --check || true

      - name: Build registry and tests through IR
        working-directory: contracts
        run: |
          # V3 currently exceeds the legacy codegen stack budget in submitAuditV3.
          # via-IR is used here only to reach behavioral tests; this does not close
          # the separate code-structure/compiler-mode review item.
          forge build --sizes --via-ir

      - name: Run Foundry tests through IR
        working-directory: contracts
        run: forge test --via-ir -vvv
