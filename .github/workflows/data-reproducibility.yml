name: DATA reproducibility

on:
  pull_request:
    paths:
      - "data_module/pyproject.toml"
      - "data_module/poetry.lock"
      - ".github/workflows/data-reproducibility.yml"
  push:
    branches:
      - main
    paths:
      - "data_module/pyproject.toml"
      - "data_module/poetry.lock"
      - ".github/workflows/data-reproducibility.yml"

permissions:
  contents: write

jobs:
  poetry-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.1.3"

      - name: Resolve DATA lockfile
        working-directory: data_module
        run: |
          poetry --version
          poetry lock --no-interaction
          test -s poetry.lock
          sha256sum poetry.lock

      - name: Upload generated lock for reproducibility review
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-data-poetry-lock
          path: data_module/poetry.lock
          if-no-files-found: error
          retention-days: 7

      - name: Bootstrap exact generated lock on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-files --error-unmatch data_module/poetry.lock >/dev/null 2>&1; then
            echo "Committed lockfile already exists; bootstrap not needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_module/poetry.lock
          git commit -m "chore(data): commit Poetry lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Require committed lockfile and zero resolution drift
        run: |
          git ls-files --error-unmatch data_module/poetry.lock
          git diff --exit-code -- data_module/poetry.lock
