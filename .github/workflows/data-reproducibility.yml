name: DATA reproducibility

on:
  pull_request:
    paths:
      - "data_module/pyproject.toml"
      - "data_module/poetry.lock"
      - ".github/workflows/data-reproducibility.yml"
  push:
    branches:
      - main
    paths:
      - "data_module/pyproject.toml"
      - "data_module/poetry.lock"
      - ".github/workflows/data-reproducibility.yml"

permissions:
  contents: read

jobs:
  poetry-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.1.3"

      - name: Resolve DATA lockfile
        working-directory: data_module
        run: |
          poetry --version
          poetry lock --no-interaction
          test -s poetry.lock
          sha256sum poetry.lock

      - name: Require committed lockfile and zero resolution drift
        run: |
          git ls-files --error-unmatch data_module/poetry.lock
          git diff --exit-code -- data_module/poetry.lock
