name: R4 Phase 6 closeout registration

on:
  push:
    branches:
      - r4/phase6-partitions-acceptance-freeze
    paths:
      - 'docs/plan/ml-R4/scripts/p6_closeout_g6.py'
      - '.github/workflows/r4-phase6-closeout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4/phase6-partitions-acceptance-freeze
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote partition and register G6 artifacts
        run: python docs/plan/ml-R4/scripts/p6_closeout_g6.py

      - name: Commit deterministic G6 closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/plan/ml-R4/manifests/p6_partition_manifest.json \
            docs/plan/ml-R4/phases/07_PHASE_6_PARTITIONS_AND_ACCEPTANCE_FREEZE.md \
            docs/plan/ml-R4/phases/08_PHASE_7_DATA_VNEXT_IMPLEMENTATION.md \
            docs/plan/ml-R4/PLAN_STATUS_MATRIX.md \
            docs/plan/ml-R4/ARTIFACT_INDEX.md \
            docs/plan/ml-R4/EXECUTION_LOG.md
          if git diff --cached --quiet; then
            echo 'G6 closeout already current.'
            exit 0
          fi
          git commit -m 'docs(ml-r4): register Phase 6 G6 closure'
          git push origin HEAD:r4/phase6-partitions-acceptance-freeze
