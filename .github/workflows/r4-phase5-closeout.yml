name: R4 Phase 5 closeout registration

on:
  push:
    branches:
      - r4/phase5-data-vnext-policy-design
    paths:
      - 'docs/plan/ml-R4/scripts/p5_closeout_g5.py'
      - '.github/workflows/r4-phase5-closeout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4/phase5-data-vnext-policy-design
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote policy and register G5 artifacts
        run: python docs/plan/ml-R4/scripts/p5_closeout_g5.py

      - name: Commit deterministic G5 closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/plan/ml-R4/specs/data_vnext_policy_v1.json \
            docs/plan/ml-R4/ARTIFACT_INDEX.md \
            docs/plan/ml-R4/EXECUTION_LOG.md
          if git diff --cached --quiet; then
            echo 'G5 closeout already current.'
            exit 0
          fi
          git commit -m 'docs(ml-r4): register Phase 5 G5 closure'
          git push origin HEAD:r4/phase5-data-vnext-policy-design
