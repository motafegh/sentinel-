name: One-shot fix repaired-lineage group count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-r4-audit-group-count.yml'

permissions:
  contents: write

jobs:
  patch-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct acceptance-report group count and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/plan/ml-R4/scripts/p8_audit_repaired_lineage.py')
          text = path.read_text(encoding='utf-8')
          old = '''            "group_count": (publication.get("role_contract_counts") or {}),'''
          new = '''            "group_count": len(grouping.get("groups") or []),
            "role_contract_counts": publication.get("role_contract_counts") or {},'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif '"role_contract_counts": publication.get("role_contract_counts") or {}' not in text:
              raise SystemExit('expected group_count pattern not found; refusing broad rewrite')
          PY
          rm '.github/workflows/one-shot-fix-r4-audit-group-count.yml'
          git config user.name 'sentinel-r4-automation'
          git config user.email 'sentinel-r4-automation@users.noreply.github.com'
          git add docs/plan/ml-R4/scripts/p8_audit_repaired_lineage.py .github/workflows/one-shot-fix-r4-audit-group-count.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(ml-r4): report repaired leakage group count correctly'
          git push origin HEAD:main
